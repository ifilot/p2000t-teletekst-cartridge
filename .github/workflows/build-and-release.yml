name: Build and release

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "*"

permissions:
  contents: read

jobs:
  cartridge:
    name: Build cartridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Z80 assembler
        run: sudo apt-get update && sudo apt-get install --yes z80asm

      - name: Build and verify cartridge
        run: |
          make -C src
          make -C src verify

      - uses: actions/upload-artifact@v4
        with:
          name: p2wp-cartridge
          path: src/p2wp-cartridge.bin
          if-no-files-found: error

  firmware:
    name: Build firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico_w
            name: Pico W
            artifact: p2wp-pico-w.uf2
          - board: pico2_w
            name: Pico 2 W
            artifact: p2wp-pico-2-w.uf2
    steps:
      - uses: actions/checkout@v5

      - name: Install Pico build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build

      - name: Check out Pico SDK
        uses: actions/checkout@v5
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.1
          path: pico-sdk
          submodules: recursive

      - name: Build firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S firmware -B build/${{ matrix.board }} -G Ninja -DPICO_BOARD=${{ matrix.board }}
          cmake --build build/${{ matrix.board }}
          mkdir -p release
          cp build/${{ matrix.board }}/p2wp-pico.uf2 release/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - cartridge
      - firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Patch ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/p2wp-cartridge.bin
            release/p2wp-pico-w.uf2
            release/p2wp-pico-2-w.uf2
